# UC1 space skeleton: the deterministic orbital backbone for the large-scale
# mobile event, generated by the Contact Plan Designer.
#
# An event site and a gateway a few hundred km apart, both served by a small
# Walker-Delta LEO shell. The satellite path is timing-certain (A1) but
# pass-limited, so it is slower than the air relays scgraph injects on top of
# it, which is exactly the tension H1 tests.
#
# Regenerate with:
#   cpd run scenarios/uc1_skeleton.yaml -o scenarios/uc1_cpd
name: scgraph-uc1-skeleton
epoch-s: 0.0
duration-s: 21600.0      # 6 h, several passes
step-s: 10.0             # fine enough that window edges are seconds-accurate

constellations:
  - code: "D:600:53:12/3/1"       # 12 sats, 3 planes, 600 km, 53 deg
    central-body: Earth
    base-id: 200
    name-prefix: sat
    data-rate-bps: 10
    constraints: { max-range-km: 3000 }

nodes:
  - id: 101
    name: EventSite
    type: lander
    central-body: Earth
    latitude-deg: 45.76           # Lyon
    longitude-deg: 4.83
    data-rate-bps: 10
    constraints: { min-elevation-deg: 10 }

  - id: 102
    name: Gateway
    type: lander
    central-body: Earth
    latitude-deg: 48.85           # Paris, ~390 km away
    longitude-deg: 2.35
    data-rate-bps: 10
    constraints: { min-elevation-deg: 10 }
